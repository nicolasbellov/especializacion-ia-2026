name: Pruebas academicas offline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Python 3.12 - ejercicios sin llamadas reales
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Credencial ficticia: el workflow SOLO ejecuta pruebas con mocks.
      GEMINI_API_KEY: ci-clave-ficticia-no-valida
      GEMINI_MODEL: gemini-3.5-flash-lite
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas Gate 1 (sin red)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Pruebas unitarias pytest Bloque 14
        run: python -m pytest test_cliente.py -v
      - name: Pruebas cliente Bloque 12
        run: python pruebas_cliente_b12.py
      - name: Pruebas cliente Bloque 13
        run: python pruebas_cliente_b13.py
      - name: Pruebas de rate limit simulado
        run: python pruebas_ensayo_rate_limit_b13.py
      - name: Integracion de cierre B13 simulada
        run: python pruebas_cierre_b13.py


  rag_b24:
    name: Python 3.12 - Chroma local sin red
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ci-clave-ficticia-no-valida
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias RAG
        run: python -m pip install -r requirements-rag.txt
      - name: Verificar dependencias
        run: python -m pip check
      - name: Verificar importaciones sin API
        run: python -c "from langchain_chroma import Chroma; from langchain_google_genai import GoogleGenerativeAIEmbeddings; print('IMPORTS OK')"
      - name: Probar RAG B24 y receta B25 (offline)
        run: |
          python -m unittest discover -s tests -p "test_*b24_booking_core.py" -v
          python -m unittest discover -s tests -p "test_receta_b25.py" -v
      - name: B25 - preparar chunks de ejemplo sin Gemini
        run: python -m src.receta_indexacion_b25 --modo preparar
      - name: Ejecutar comparacion del curso y corpus ficticio
        run: |
          python test_chunking.py
          python -m src.comparar_chunking_b24_booking_core
